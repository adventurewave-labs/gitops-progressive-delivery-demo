apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: payments-api
  namespace: payment-prod
  labels:
    app: payments-api
spec:
  replicas: 4
  selector:
    matchLabels:
      app: payments-api
  template:
    metadata:
      labels:
        app: payments-api
        version: v2.3
    spec:
      containers:
      - name: api
        image: payments-api:v2.3
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: VERSION
          value: "v2.3"
        - name: PORT
          value: "8080"
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 128Mi
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
          failureThreshold: 3
  strategy:
    canary:
      canaryService: payments-api-canary
      stableService: payments-api-stable
      steps:
      - setWeight: 20
      - pause: { duration: 15s }
      - setWeight: 50
      - analysis:
          templates:
          - templateName: prometheus-slo
          args:
          - name: service-name
            value: payments-api-canary
      - setWeight: 100
      abortScaleDownDelaySeconds: 30
