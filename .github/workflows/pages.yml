name: showcase-pages

# Publishes public/showcase/ (the GIFs + the last uat-test.sh results) to
# GitHub Pages, so the showcase is readable without launching a Codespace.
# The workflow enables Pages itself on first run (configure-pages enablement).

on:
  push:
    branches: [main]
    paths:
      - 'public/showcase/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # enablement:true turns Pages on via the API on first run, so a fork
      # does not need anyone to visit Settings -> Pages by hand.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public/showcase
      - id: deployment
        uses: actions/deploy-pages@v4
