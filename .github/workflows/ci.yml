name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ESLint
        run: bun run lint

  build-apps:
    name: Build payments-api images
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build stable image (v2.3)
        run: docker build -t payments-api:v2.3 payments-app/stable/

      - name: Build canary image (v2.4)
        run: docker build -t payments-api:v2.4 payments-app/canary/

      - name: Verify images built
        run: |
          echo "stable: $(docker images payments-api:v2.3 --format '{{.Size}}')"
          echo "canary: $(docker images payments-api:v2.4 --format '{{.Size}}')"

  docker-build:
    name: Build dashboard Docker image
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & export image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: gitops-progressive-delivery-demo:ci
          outputs: type=docker,dest=/tmp/image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the container
        run: |
          docker load --input /tmp/image.tar
          docker run --rm -d -p 3000:3000 --name smoke gitops-progressive-delivery-demo:ci
          sleep 5
          for i in {1..10}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/ || true)
            if [ "$code" = "200" ]; then echo "OK: HTTP 200"; exit 0; fi
            sleep 2
          done
          echo "FAIL: never got 200"
          docker logs smoke || true
          exit 1