# gitops-progressive-delivery-demo
#
# One-command local stack: `docker compose up --build`.
# Builds the standalone Next.js image and serves it on http://localhost:3000.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: gitops-progressive-delivery-demo:latest
    container_name: gitops-demo
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD-SHELL"
        - "node -e \"fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
