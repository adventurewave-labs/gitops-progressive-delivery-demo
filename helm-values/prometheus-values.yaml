# Prometheus Stack Helm values for the demo
# Minimal: no Grafana, no Alertmanager, 5s scrape interval

prometheus:
  service:
    type: NodePort
    nodePort: 30900
  prometheusSpec:
    scrapeInterval: 5s
    retention: 15m
    # By default the chart restricts discovery to objects labelled
    # release=prometheus in the release namespace, which silently ignored the
    # payment-prod ServiceMonitor — every canary query returned an empty vector.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}
    podMonitorSelector: {}
    podMonitorNamespaceSelector: {}
    resources:
      limits:
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 256Mi
    # Short intervals to capture the canary failure fast
    evaluationInterval: 5s

alertmanager:
  enabled: false

grafana:
  enabled: false

kubeStateMetrics:
  resources:
    limits:
      memory: 128Mi

prometheus-node-exporter:
  resources:
    limits:
      memory: 64Mi
